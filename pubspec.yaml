name: quick_salon
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.4

  cupertino_icons: ^1.0.8

  supabase_flutter: ^2.8.0
  provider: ^6.1.2
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App Icon Generator
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icons/app_icon.png"

  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"

  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"